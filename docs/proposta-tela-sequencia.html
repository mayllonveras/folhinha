<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proposta · Tela de dias seguidos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Lexend:wght@400;500;600;700&display=swap">
<style>
.light{--bg:#F3F5FA;--surface:#fff;--soft:#E8EDF7;--line:#D3DBEA;--ink:#16223F;--muted:#5A6984;--primary:#2457D6;--primary-edge:#173F9F;--on-primary:#fff;--ok:#107A58;--ok-fill:#1CA97B;--ball:#FFB92B;--on-ball:#16223F;--off:#D3DBEA;--page:#dfe5f1}
.dark{--bg:#0A1123;--surface:#131D36;--soft:#1B2947;--line:#283A60;--ink:#EAF0FB;--muted:#94A5C2;--primary:#7EA2FF;--primary-edge:#4F73C9;--on-primary:#0A1123;--ok:#46DBA9;--ok-fill:#46DBA9;--ball:#FFC94A;--on-ball:#0A1123;--off:#283A60;--page:#05080F}
*{box-sizing:border-box}body{margin:0;font-family:Lexend,system-ui,sans-serif;padding:24px 16px;background:#cfd6e6}
h1{font-family:"Bricolage Grotesque";font-size:1.4rem;margin:0 0 4px;text-align:center;color:#16223F}.sub{text-align:center;color:#5A6984;font-size:.9rem;margin:0 auto 20px}
section.theme{background:var(--page);border-radius:24px;padding:22px 12px;margin:0 auto 22px;max-width:1620px}
section.theme>h3{margin:0 0 16px;text-align:center;font-family:"Bricolage Grotesque";color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}figcaption{font-size:.8rem;color:var(--muted);text-align:center;max-width:330px}figcaption b{color:var(--ink)}
.phone{width:360px;height:660px;background:var(--bg);color:var(--ink);border-radius:32px;border:8px solid #16223F;overflow:hidden;display:flex;flex-direction:column;padding:26px 20px 22px}
.dark .phone{border-color:#283A60}
.panel{background:var(--surface);border-radius:22px;padding:18px}h2{font-family:"Bricolage Grotesque";margin:14px 0 4px;font-size:1.2rem}
.score{display:flex;align-items:center;gap:16px}.big{font-family:"Bricolage Grotesque";font-weight:800;font-size:3.2rem;line-height:1}
.seal{width:88px;height:88px;border-radius:50%;border:4px solid var(--ok-fill);color:var(--ok);display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;transform:rotate(-10deg);outline:1.5px solid var(--ok-fill);outline-offset:-9px}
.muted{color:var(--muted)}.sm{font-size:.85rem}.c{text-align:center;margin-top:14px}
.kv{display:flex;gap:10px;margin-top:14px}.kv div{flex:1;background:var(--soft);border-radius:14px;padding:10px;text-align:center}.kv b{display:block;font-family:"Bricolage Grotesque";font-size:1.2rem}.kv span{font-size:.7rem;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:15px 22px;font:600 1.05rem Lexend;background:var(--primary);color:var(--on-primary);box-shadow:0 3px 0 var(--primary-edge);width:100%;margin-top:auto}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;margin-top:10px}
.hero{text-align:center;margin-top:18px}.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:"Bricolage Grotesque";font-weight:800;font-size:6.4rem;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}.num small{display:block;font-size:1.5rem;color:var(--muted);margin-top:2px}
.trail{margin-top:10px;background:var(--surface);border-radius:22px;padding:118px 8px 14px;position:relative}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative}
.d{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative}.d .wd{font-size:.72rem;font-weight:600;color:var(--muted)}.d.today .wd{color:var(--ink)}
.dot{width:32px;height:32px;border-radius:50%;background:var(--off);display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:.8rem;position:relative;z-index:1}
.d.done .dot{background:var(--ball);color:var(--on-ball)}.d.today .dot{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--primary)}
.dot svg{width:17px;height:17px;stroke:var(--on-ball);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.d.goal .dot{background:none;border:2.5px dashed var(--muted);color:var(--muted)}.d.goal.done .dot{border:0;background:var(--ball)}
.days:before,.days:after{content:"";position:absolute;left:calc(100%/var(--n)/2);top:calc(1.1rem + 7px + 15px);height:5px;border-radius:9px;background:var(--off)}.days:before{right:calc(100%/var(--n)/2)}
.days:after{width:calc((100% - 100%/var(--n))*var(--p));background:var(--ball)}
.prize{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.pill{position:relative;background:var(--primary);color:var(--on-primary);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.78rem;white-space:nowrap}
.pill:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--primary)}
.pk{width:46px;height:67px;object-fit:contain;margin-top:8px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));border-radius:4px}.pk2{display:flex;margin-top:8px}.pk2{margin-right:8px}.pk2 .pk{margin-top:0;width:40px;height:58px}.pk2 .pk+.pk{margin-left:-14px;transform:rotate(8deg) translateY(2px)}.prize.open .pk{filter:drop-shadow(0 0 10px var(--ball))}
.msg{text-align:center;font-weight:600;font-size:1.15rem;margin-top:22px;line-height:1.35;text-wrap:balance}.msg b{font-size:1.3rem}
.hint{text-align:center;font-size:.8rem;color:var(--muted);margin-top:10px}
.conf i{position:absolute;width:9px;height:14px;border-radius:2px;opacity:.9}
</style></head><body>
